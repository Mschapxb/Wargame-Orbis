name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: python -m pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: python -m ruff check src run_tests.py
      - name: Tests
        run: python run_tests.py
      - name: Équité à armées égales (graines fixes)
        run: python src/bench_fairness.py 60 --quick
